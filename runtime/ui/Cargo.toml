# runtime/ui/Cargo.toml

[package]
name = "ui"
version = "0.1.0"
edition = "2021"

[dependencies]

# -------------------------------------------------
# GUI Framework
# -------------------------------------------------

eframe = "0.27"
egui = "0.27"

# -------------------------------------------------
# Async Runtime
# -------------------------------------------------

tokio = { version = "1", features = ["full"] }

# -------------------------------------------------
# Serialization
# -------------------------------------------------

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# -------------------------------------------------
# Error Handling
# -------------------------------------------------

anyhow = "1"

# -------------------------------------------------
# Logging / Observability
# -------------------------------------------------

tracing = "0.1"
tracing-subscriber = "0.3"