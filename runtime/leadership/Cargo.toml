# runtime/leadership/Cargo.toml

[package]
name = "leadership"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

anyhow = "1"

tracing = "0.1"
tracing-subscriber = "0.3"

sysinfo = "0.30"
node_agent = { path = "../node_agent" }